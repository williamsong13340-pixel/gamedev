<title>情侣小游戏</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a one-screen phone app. The whole screen takes the colour of whoever's turn it is;
   the one thing to do next is always the solid button at the bottom, within thumb reach. */
:root{
  --bg:#FDF1F4; --surface:#FFFFFF; --surface-2:#FFF9FA; --line:#F3DCE4;
  --ink:#3B2140; --ink-2:#7B5F7E; --ink-3:#B49CB5;
  --rose:#E4507A; --rose-soft:#FCDDE6; --rose-wash:#FDEAF0;
  --iris:#7468DB; --iris-soft:#E3E0FA; --iris-wash:#EFEDFC;
  --do:#EF7F4C; --do-soft:#FFE4D6; --say:#1E9E91; --say-soft:#D5F2EE; --wow:#D9940F; --wow-soft:#FCEDC4;
  --on-accent:#FFFFFF; --shadow:0 12px 32px rgba(125,60,95,.16); --shadow-s:0 4px 14px rgba(125,60,95,.10);
  --font:-apple-system,"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Microsoft YaHei","WenQuanYi Zen Hei",system-ui,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded","Nunito",var(--font);
  --r-l:28px; --r-m:20px; --r-s:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1120; --surface:#2B1C31; --surface-2:#231629; --line:#402C47;
  --ink:#F8EAF2; --ink-2:#CBB0C9; --ink-3:#8C708B;
  --rose:#FF7FA0; --rose-soft:#4B2236; --rose-wash:#291423;
  --iris:#A89DFF; --iris-soft:#302B58; --iris-wash:#1C1933;
  --do:#FF9E73; --do-soft:#4A2A1D; --say:#5FD2C4; --say-soft:#163F3A; --wow:#F6C352; --wow-soft:#483913;
  --on-accent:#26121F; --shadow:0 12px 32px rgba(0,0,0,.45); --shadow-s:0 4px 14px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1120; --surface:#2B1C31; --surface-2:#231629; --line:#402C47;
  --ink:#F8EAF2; --ink-2:#CBB0C9; --ink-3:#8C708B;
  --rose:#FF7FA0; --rose-soft:#4B2236; --rose-wash:#291423;
  --iris:#A89DFF; --iris-soft:#302B58; --iris-wash:#1C1933;
  --do:#FF9E73; --do-soft:#4A2A1D; --say:#5FD2C4; --say-soft:#163F3A; --wow:#F6C352; --wow-soft:#483913;
  --on-accent:#26121F; --shadow:0 12px 32px rgba(0,0,0,.45); --shadow-s:0 4px 14px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--wash,var(--bg));color:var(--ink);font:16px/1.55 var(--font);transition:background-color .5s ease;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
body[data-turn="0"]{--wash:var(--rose-wash);--pc:var(--rose);--pc-soft:var(--rose-soft)}
body[data-turn="1"]{--wash:var(--iris-wash);--pc:var(--iris);--pc-soft:var(--iris-soft)}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--iris);outline-offset:3px}
h1,h2,h3,p{margin:0} ul,ol{margin:0;padding:0}
svg.i{width:1em;height:1em;fill:currentColor;flex:none}

#app{max-width:460px;height:100%;margin:0 auto}
.screen{height:100%;display:flex;flex-direction:column;gap:16px;padding-block:14px 18px;overflow-y:auto;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen>*{flex-shrink:0}
.screen>.grow{flex:1 1 0;min-height:0}
.screen>.stage{min-height:170px}

/* buttons: one solid per screen, the rest quiet */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:0 20px;border-radius:var(--r-m);
  background:var(--pc,var(--rose));color:var(--on-accent);font-weight:700;font-size:18px;box-shadow:0 8px 20px color-mix(in srgb,var(--pc,var(--rose)) 35%,transparent);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.kind{background:var(--tc);box-shadow:0 8px 20px color-mix(in srgb,var(--tc) 35%,transparent)}
.btn.quiet{background:none;color:var(--ink-2);box-shadow:none;min-height:46px;font-size:15px;font-weight:600}
.btn.soft{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}
.btn[disabled]{opacity:.4;pointer-events:none}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--ink-2);background:var(--surface);box-shadow:var(--shadow-s)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--ink-2)}
.bar{display:flex;align-items:center;gap:12px}
.bar h2{flex:1;text-align:center;font-size:17px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .spacer{width:44px}

/* home */
.hero{position:relative;padding:22px 4px 6px;min-height:160px}
.hero h1{font-size:38px;line-height:1.15;font-weight:800;letter-spacing:.02em;margin-top:6px}
.hero p{margin-top:10px;color:var(--ink-2);max-width:13em}
.duo{position:absolute;right:-6px;top:8px;width:150px;height:150px;pointer-events:none}
.duo i{position:absolute;width:96px;height:96px;border-radius:50%}
.duo i:first-child{left:0;top:10px;background:var(--rose);opacity:.85;animation:bob 5s ease-in-out infinite}
.duo i:last-child{right:0;bottom:6px;background:var(--iris);opacity:.8;mix-blend-mode:multiply;animation:bob 5s ease-in-out -2.5s infinite}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .duo i:last-child{mix-blend-mode:screen}}
:root[data-theme="dark"] .duo i:last-child{mix-blend-mode:screen}
@keyframes bob{50%{transform:translateY(-7px)}}
.resume{align-self:flex-start;padding:10px 18px;border-radius:99px;background:var(--rose-soft);color:var(--rose);font-weight:700;font-size:14.5px}
.games{display:flex;flex-direction:column;gap:12px}
.g{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r-l);background:var(--surface);box-shadow:var(--shadow-s);text-align:left;width:100%;transition:transform .12s}
.g:active{transform:scale(.98)}
.g .art{width:62px;height:62px;flex:none;border-radius:18px;background:var(--bg);padding:5px}
.g span{flex:1;min-width:0}
.g b{display:block;font-size:19px;font-weight:800}
.g small{display:block;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.g .go{transform:rotate(180deg);color:var(--ink-3);font-size:20px}
.fine{font-size:12.5px;color:var(--ink-3);text-align:center}

/* setup */
.field{display:flex;flex-direction:column;gap:10px}
.field>.lab{font-size:14px;font-weight:700;color:var(--ink-2)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.name{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r-s);padding:0 14px;height:52px;box-shadow:var(--shadow-s)}
.name i{width:14px;height:14px;border-radius:50%;flex:none}
.name input{border:0;background:none;outline:0;width:100%;min-width:0;font-weight:700;font-size:17px}
.name:focus-within{outline:3px solid var(--iris);outline-offset:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;text-align:left;padding:12px 14px;border-radius:var(--r-m);background:var(--surface-2);border:2px solid transparent;transition:background-color .2s,border-color .2s;min-width:0}
.opt b{font-size:17px}
.opt small{flex-basis:100%;color:var(--ink-2);font-size:12.5px;line-height:1.4}
.opt .heat{margin-left:auto;display:flex;gap:2px;font-size:15px;color:var(--line)}
.opt .heat .on{color:var(--rose)}
.opt[aria-checked="true"]{background:var(--surface);border-color:var(--rose);box-shadow:var(--shadow-s)}
.links{display:flex;justify-content:center;gap:4px}
.links .btn{width:auto;min-height:34px;font-size:14px;padding:0 12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{padding:10px 4px;border-radius:var(--r-s);background:var(--surface-2);border:2px solid transparent;line-height:1.3}
.seg b{display:block;font:800 20px var(--font-num)}
.seg small{font-size:12px;color:var(--ink-2)}
.seg button[aria-checked="true"]{background:var(--surface);border-color:var(--rose);box-shadow:var(--shadow-s)}

/* play: shared by the three games */
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{--c:var(--rose);border-radius:var(--r-m);padding:10px 12px;background:color-mix(in srgb,var(--surface) 55%,transparent);opacity:.72;transition:all .35s;min-width:0}
.pl[data-p="1"]{--c:var(--iris)}
.pl.on{background:var(--surface);opacity:1;box-shadow:var(--shadow-s),inset 0 0 0 2px var(--c)}
.score.idle .pl{opacity:1;background:var(--surface)}
.pl .n{display:flex;align-items:center;gap:6px;font-weight:800;white-space:nowrap;overflow:hidden}
.pl .n i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.pl .n span{margin-left:auto;font:800 17px var(--font-num);color:var(--c)}
.hearts{display:grid;grid-template-columns:repeat(var(--cols,7),1fr);gap:3px;margin-top:6px;max-width:150px}
.hearts svg{width:100%;height:auto;aspect-ratio:1;fill:var(--line);transition:fill .3s}
.hearts svg.on{fill:var(--c)}
.hearts svg.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.2)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
.pl .sk{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.pl .meta{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.prog{height:8px;border-radius:99px;background:var(--line);margin-top:9px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .4s}
.turn{text-align:center}
.turn .eyebrow{display:block}
.turn b{font-size:28px;font-weight:800;color:var(--pc,var(--ink));line-height:1.25}
.stage{display:grid;place-items:center;perspective:1200px}
.t-d{--tc:var(--do);--tc-soft:var(--do-soft)} .t-s{--tc:var(--say);--tc-soft:var(--say-soft)} .t-w{--tc:var(--wow);--tc-soft:var(--wow-soft)}
.acts{display:flex;flex-direction:column;gap:4px;min-height:106px;justify-content:flex-end}
.acts .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .rowx{display:flex;align-items:center;gap:14px}
.acts .rowx .btn{flex:1;width:auto}
.note{font-size:13px;color:var(--ink-2);text-align:center;min-height:46px;display:grid;place-items:center}
.legend{display:flex;justify-content:center;gap:8px;padding-bottom:18px}
.legend .chip{font-size:13px;padding:6px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--tc-soft);color:var(--tc)}
.chip.who{background:var(--pc-soft);color:var(--pc)}

/* cards */
.hand{display:flex;justify-content:center;gap:10px;width:100%;align-items:center}
.back{flex:1;max-width:118px;aspect-ratio:5/7;border-radius:var(--r-m);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:var(--on-accent);font-weight:700;font-size:14px;box-shadow:var(--shadow);background:var(--tc);transition:transform .25s;animation:dealin .45s backwards}
.back::before{content:"";position:absolute;inset:7px;border-radius:14px;border:1.5px dashed color-mix(in srgb,var(--on-accent) 55%,transparent)}
.back svg{font-size:34px}
.back:nth-child(1){transform:rotate(-5deg) translateY(6px)}
.back:nth-child(2){animation-delay:.07s}
.back:nth-child(3){transform:rotate(5deg) translateY(6px);animation-delay:.14s}
.back:active{transform:scale(.95)}
@keyframes dealin{from{opacity:0;translate:0 40px}}
.flip{height:min(100%,400px);aspect-ratio:5/7;max-width:100%;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.3,.5,1);transform:rotateY(180deg)}
.flip.open{transform:none}
.flip>*{position:absolute;inset:0;border-radius:var(--r-l);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .rear{background:var(--tc);transform:rotateY(180deg);box-shadow:var(--shadow)}
.face{background:var(--surface);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:8px;container-type:inline-size;overflow:hidden}
.face::after{content:"";position:absolute;inset:auto 0 0 0;height:8px;background:var(--tc)}
.face .txt{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;font-size:clamp(14px,9cqi,25px);line-height:1.5;font-weight:600;text-wrap:pretty;padding-bottom:6px}
.face .txt.long{font-size:clamp(13px,7cqi,19px)}
.face .txt strong{display:block;font-size:.72em;color:var(--tc);margin-bottom:.3em;letter-spacing:.08em}
.face .txt b{color:var(--pc)}
.face .rw{align-self:flex-end;display:flex;align-items:center;gap:4px;font:800 17px var(--font-num);color:var(--pc);padding-bottom:6px}

/* truth or dare */
.wheel{width:min(100%,260px);max-height:100%;aspect-ratio:1;border-radius:50%;position:relative;background:conic-gradient(var(--iris) 0 180deg,var(--rose) 180deg 360deg);box-shadow:var(--shadow),inset 0 0 0 9px var(--surface)}
.wheel .nm{position:absolute;top:50%;translate:0 -50%;width:27%;text-align:center;color:var(--on-accent);font-weight:800;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.wheel .nm.l{left:7%} .wheel .nm.r{right:7%}
.needle{position:absolute;left:50%;top:9%;width:26px;height:41%;margin-left:-13px;transform-origin:50% 100%;background:var(--surface);clip-path:polygon(50% 0,100% 100%,0 100%);transition:transform 2.4s cubic-bezier(.12,.75,.2,1)}
.hub{position:absolute;inset:37%;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-s);display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--ink-2)}

/* flight chess */
.stage.cq{container-type:size}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;width:min(100%,117cqh)}
.cell{aspect-ratio:1;border-radius:24%;background:var(--tc-soft);color:var(--tc);position:relative;display:grid;place-items:center;font-weight:800;font-size:12.5px;line-height:1}
.cell svg{font-size:17px;opacity:.85}
.cell u{position:absolute;left:5px;top:4px;font:600 9px var(--font-num);text-decoration:none;color:var(--ink-3)}
.cell.t-a,.cell.t-z{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s);font-size:15px}
.piece{position:absolute;bottom:-3px;width:46%;aspect-ratio:1;border-radius:50%;background:var(--c);border:2px solid var(--surface);box-shadow:0 3px 8px rgba(0,0,0,.25);z-index:2;display:grid;place-items:center;color:var(--on-accent);font-size:10px;font-weight:800}
.piece[data-p="0"]{--c:var(--rose);left:-3px} .piece[data-p="1"]{--c:var(--iris);right:-3px}
.piece.hop{animation:hop .18s}
.piece.me{z-index:3;animation:pulse 1.4s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-45%) scale(1.15)}}
@keyframes pulse{50%{box-shadow:0 3px 8px rgba(0,0,0,.25),0 0 0 5px color-mix(in srgb,var(--c) 30%,transparent)}}
.dice{width:60px;height:60px;flex:none;border-radius:18px;background:var(--surface);box-shadow:var(--shadow-s);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:11px;gap:3px}
.dice i{border-radius:50%}
.dice i.on{background:var(--pc,var(--rose))}
.dice.rolling{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}

/* win */
.win{align-items:stretch;justify-content:center;text-align:center}
.win .big{font-size:40px;font-weight:800;color:var(--pc);line-height:1.2}
.win .wish{background:var(--surface);border-radius:var(--r-l);padding:22px;box-shadow:var(--shadow);font-size:18px}
.win .wish b{color:var(--pc)}
.burst{height:120px;position:relative}
.burst svg{position:absolute;left:50%;top:50%;fill:var(--pc);width:64px;height:64px;margin:-32px;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
.burst svg+svg{width:26px;height:26px;margin:-52px 0 0 34px;opacity:.6;animation-delay:.15s;animation-fill-mode:backwards}
.burst svg+svg+svg{margin:6px 0 0 -70px;width:20px;height:20px;fill:var(--wow);animation-delay:.3s}

/* sheets + toast */
.veil{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
:root[data-theme="dark"] .veil{background:rgba(0,0,0,.6)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .veil{background:rgba(0,0,0,.6)}}
.veil.mid{align-items:center;padding:16px}
.cardbox{width:min(100%,330px);display:flex;flex-direction:column;gap:16px}
.cardbox .slot{height:min(54vh,400px);display:grid;place-items:center;perspective:1200px}
.cardbox .acts{min-height:0;gap:10px}
.sheet{width:100%;max-width:492px;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:var(--r-l) var(--r-l) 0 0;display:flex;flex-direction:column;gap:14px;
  padding:22px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:up .3s cubic-bezier(.2,1,.4,1)}
.sheet h3{font-size:22px;font-weight:800}
.steps{display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{list-style:none;display:flex;gap:12px;background:var(--surface);padding:14px;border-radius:var(--r-m)}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--rose-soft);color:var(--rose);font:800 15px var(--font-num)}
.steps .chips{margin:6px 0 2px}
textarea{width:100%;min-height:190px;border:0;border-radius:var(--r-m);background:var(--surface);padding:14px;resize:vertical;line-height:1.7}
.hint{font-size:13px;color:var(--ink-2)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;font-size:60px;cursor:pointer}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(40%);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translate(-50%,220px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:30;transition:transform .35s cubic-bezier(.2,1.2,.4,1);white-space:nowrap;pointer-events:none}
#toast.show{transform:translate(-50%,0)}
@media (max-height:700px){.turn b{font-size:22px}.acts{min-height:92px}.btn{min-height:50px}.hero{min-height:124px;padding-top:10px}.hero h1{font-size:32px}.hero p{display:none}.screen{gap:10px}
  .pl .sk{display:none}.face{padding:12px;gap:6px}.face .chip{font-size:11px;padding:3px 8px}.face .rw{font-size:15px}.legend{padding-bottom:10px}.duo{transform:scale(.8);transform-origin:top right}
  .g{padding:11px}.g .art{width:52px;height:52px}.g small{font-size:12.5px}.dice{width:52px;height:52px;padding:9px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

  <symbol id="i-d" viewBox="0 0 24 24"><path d="M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 0 0 0-19zm-2 5.6 6 3.9-6 3.9z"/></symbol>
  <symbol id="i-s" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.6 4.2V16A2.5 2.5 0 0 1 4 13.5z"/></symbol>

/* ---------- 自带题库：想改内容，改这里就行。d=行动 s=真心话 b=两人一起 ---------- */

};

const GAMES = { cards: '心动卡牌', tod: '真心话大冒险', chess: '双人飞行棋' };

const CHIPS = '<div class="chips">' + ['d', 's', 'w'].map(t => `<span class="chip t-${t}"><svg class="i"><use href="#i-${t}"/></svg>${TYPE[t].name}</span>`).join('') + '</div>';

function draw(t) { const q = G.q; if (!q[t].length) { q[t] = shuffle(q['u' + t]); q['u' + t] = []; } const c = q[t].shift(); q['u' + t].push(c); return c; }

  $('#goal-field').hidden = setupGame !== 'cards';
  const list = deckList(setupGame), box = $('#decks'); box.replaceChildren();
  const cur = getDeck(setupGame, P.deckId).id;
  for (const dk of list) {
    const o = el('button', 'opt'); o.setAttribute('role', 'radio'); o.setAttribute('aria-checked', cur === dk.id);
    const heat = el('span', 'heat'); for (let i = 1; i <= 3 && dk.heat; i++) heat.append(icon('i-heart', 'i' + (i <= dk.heat ? ' on' : '')));
    if (dk.heat) heat.setAttribute('aria-label', `亲密程度 ${dk.heat} / 3`);
    o.append(el('b', '', dk.name), heat, el('small', '', dk.sub));
    o.onclick = () => { if (dk.locked) return editCustom(); P.deckId = dk.id; save(); renderSetup(); }; box.append(o);
  }
  const gs = $('#goals'); gs.replaceChildren();
  for (const [g, time] of GOALS) {
    const o = el('button'); o.setAttribute('role', 'radio'); o.setAttribute('aria-checked', P.goal === g);
    o.append(el('b', '', g + ' 颗'), el('small', '', time)); o.onclick = () => { P.goal = g; save(); renderSetup(); }; gs.append(o);
  }
}
['a', 'b'].forEach((k, i) => $('#name-' + k).addEventListener('input', e => { P.names[i] = e.target.value; save(); }));
const editCustom = () => { $('#custom-text').value = P.custom; openSheet('#custom'); };
$('#edit-custom').onclick = editCustom;
$('#save-custom').onclick = () => {
  P.custom = $('#custom-text').value; const n = customLines().length; save(); $('#custom').hidden = true; renderSetup();
  toast(n >= MIN_CUSTOM ? `已保存 ${n} 条专属内容` : `已保存。再写 ${MIN_CUSTOM - n} 行就能选`);
};

/* ---------- 导入题库 ---------- */
function importState() {
  const n = P.imported.length, total = P.imported.reduce((a, x) => a + x.d.length + x.s.length, 0);
  $('#import-state').textContent = n ? `现在已导入 ${n} 套，共 ${total} 条。再导入会替换掉它们。` : '现在还没有导入过。';
  $('#import-clear').hidden = !n;
}
$('#open-import').onclick = () => { importState(); openSheet('#import'); };
$('#import-clear').onclick = () => { P.imported = []; save(); importState(); renderSetup(); toast('已删除导入的题库'); };
$('#import-file').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onerror = () => toast('文件读不出来，再试一次');
  rd.onload = () => {
    let data; try { data = JSON.parse(rd.result); } catch (err) { return toast('这不是题库文件'); }
    if (!data || data.format !== IMPORT_FORMAT || !Array.isArray(data.decks)) return toast('这不是题库文件');
    const clean = a => Array.isArray(a) ? [...new Set(a.filter(x => typeof x === 'string').map(x => x.trim()).filter(Boolean))] : [];
    const decks = data.decks.filter(x => x && GAMES[x.game] && typeof x.name === 'string').map(x => ({ name: x.name.slice(0, 12), game: x.game, d: clean(x.d), s: clean(x.s) })).filter(x => x.d.length + x.s.length >= 3);
    if (!decks.length) return toast('文件里没有可用的内容');
    const before = P.imported; P.imported = decks;
    if (!save()) { P.imported = before; return toast('手机存储空间不够，没有导入'); }
    importState(); renderSetup(); toast(`已导入 ${decks.length} 套内容`);
  };
  rd.readAsText(f);
});

/* ---------- 三个游戏共用的界面零件 ---------- */
function fill(node, text, ta) { text.split('{ta}').forEach((part, i) => { if (i) node.append(el('b', '', ta)); node.append(part); }); }
function scoreboard(active, info) {
  const sc = $('#score'); sc.replaceChildren(); sc.classList.toggle('idle', active == null);
  G.names.forEach((n, p) => {
    const box = el('div', 'pl' + (p === active ? ' on' : '')); box.dataset.p = p; const i = info(p);
    const nm = el('div', 'n'); nm.append(el('i'), n, el('span', '', i.badge)); box.append(nm, i.body); if (i.foot) box.append(el('div', 'sk', i.foot)); sc.append(box);
  });
}
function banner(eyebrow, name) { $('#turn-eyebrow').textContent = eyebrow; $('#turn-name').textContent = name; }
function cardEl(c, me, reward, label) {
  const flip = el('div', 'flip t-' + c.t), face = el('div', 'face');
  const chips = el('div', 'chips'), tch = el('span', 'chip'); tch.append(icon('i-' + c.t), label || TYPE[c.t].name); chips.append(tch);
  if (!c.fx || c.fx === 'steal') chips.append(el('span', 'chip who', c.who === 'both' ? '两人一起' : G.names[me] + ' 来'));
  const txt = el('div', 'txt' + (c.text.length > 34 ? ' long' : '')); if (c.title) txt.append(el('strong', '', c.title));
  const pp = el('span'); fill(pp, c.text, G.names[1 - me]); txt.append(pp); face.append(chips, txt);
  if (reward) { const rw = el('div', 'rw'); rw.append(reward, icon('i-heart')); face.append(rw); }
  flip.append(el('div', 'rear'), face);
  requestAnimationFrame(() => requestAnimationFrame(() => flip.classList.add('open')));
  return flip;
}
const R = {}, INIT = {};
function render() { $('#stage').className = 'stage grow'; $('#stage').replaceChildren(); $('#acts').replaceChildren(); R[G.game](); }
function newGame(game) {
  const dk = getDeck(game, P.deckId);
  G = { game, names: names(), deckName: dk.name, turn: rnd(2), winner: null, card: null };
  Object.assign(G, INIT[game](dk)); save(); go('play');
  if (!P.seenRules[game]) { P.seenRules[game] = true; save(); openRules(game); } else if (game !== 'tod') toast(`${G.names[G.turn]} 先来`);
}

/* ---------- 心动卡牌 ---------- */
INIT.cards = dk => { const g = { goal: P.goal, hearts: [0, 0], skips: [SKIPS, SKIPS], deck: shuffle(dk.cards.concat(WOW)), pile: [], drawn: 0 }; g.hand = g.deck.splice(0, 3); return g; };
function deal() {
  if (G.deck.length < 3) { G.deck = G.deck.concat(shuffle(G.pile)); G.pile = []; toast('牌翻完一轮了，已重新洗牌'); }
  G.hand = G.deck.splice(0, 3); G.card = null;
}
function pick(i) {
  if (G.card) return;                                   // 防止连点
  G.card = G.hand[i]; G.deck.push(...G.hand.filter((_, k) => k !== i)); G.hand = []; G.drawn++; save(); render();
}
function cardsDone(done) {
  const c = G.card; if (!c) return;
  const me = G.turn, ta = 1 - me, gained = [];
  if (done) {
    if (c.fx === 'steal') { if (G.hearts[ta] > 0) G.hearts[ta]--; G.hearts[me]++; gained.push(me); }
    else if (c.who === 'both') { G.hearts[0]++; G.hearts[1]++; gained.push(0, 1); }
    else { G.hearts[me] = Math.min(G.goal, G.hearts[me] + (c.hearts || 1)); gained.push(me); }
  } else G.skips[me]--;
  G.pile.push(c); G.card = null;
  const won = G.hearts[me] >= G.goal ? me : G.hearts[ta] >= G.goal ? ta : null;
  if (won != null) { G.winner = won; save(); return go('win'); }
  G.turn = ta; deal(); save(); wash(); render(); popHearts(gained);
}
function popHearts(ps) { ps.forEach(p => { const h = $$(`.pl[data-p="${p}"] .hearts svg.on`).pop(); if (h) h.classList.add('pop'); }); }
R.cards = () => {
  const me = G.turn, stage = $('#stage'), acts = $('#acts');
  $('#play-title').textContent = `${G.deckName} · 集满 ${G.goal} 颗心`;
  scoreboard(me, p => { const hs = el('div', 'hearts'); hs.style.setProperty('--cols', G.goal); for (let i = 0; i < G.goal; i++) hs.append(icon('i-heart', i < G.hearts[p] ? 'on' : '')); return { badge: G.hearts[p] + '/' + G.goal, body: hs, foot: `还能跳过 ${G.skips[p]} 次` }; });
  if (!G.card) {
    banner('轮到 · 选一张牌翻开', G.names[me]);
    const hand = el('div', 'hand');
    G.hand.forEach((c, i) => { const bk = el('button', 'back t-' + c.t); bk.append(icon('i-' + c.t), el('span', '', TYPE[c.t].name)); bk.setAttribute('aria-label', '翻开这张' + TYPE[c.t].name + '牌'); bk.onclick = () => pick(i); hand.append(bk); });
    stage.append(hand);
    const lg = el('div', 'legend'); for (const t of ['d', 's', 'w']) { const ch = el('span', 'chip t-' + t); ch.append(icon('i-' + t), TYPE[t].name); lg.append(ch); } acts.append(lg);
    return;
  }
  const c = G.card, steal = c.fx === 'steal';
  banner('轮到', G.names[me]);
  stage.append(cardEl(c, me, c.who === 'both' ? '各 +1' : '+' + (c.hearts || 1)));
  acts.append(btn(steal ? '收下这颗心' : TYPE[c.t].done, '', () => cardsDone(true), 'i-heart'));
  if (!steal) { const sk = btn(G.skips[me] > 0 ? `跳过这张（还剩 ${G.skips[me]} 次）` : '跳过次数用完了', 'quiet', () => cardsDone(false)); sk.disabled = G.skips[me] <= 0; acts.append(sk); }
};

/* ---------- 真心话大冒险 ---------- */
INIT.tod = dk => ({ turn: null, q: queues(dk.cards), phase: 'spin', round: 1, cnt: [{ s: 0, d: 0 }, { s: 0, d: 0 }], run: [0, 0], streak: { p: null, n: 0 }, swapLeft: 1 });
function spin() {
  if (busy || G.phase !== 'spin') return; busy = true;
  const p = G.streak.n >= 2 ? 1 - G.streak.p : rnd(2);     // 同一个人最多连着两次
  G.streak = { p, n: G.streak.p === p ? G.streak.n + 1 : 1 }; G.turn = p; G.phase = 'choose'; G.swapLeft = 1; save();
  const target = (p === 1 ? 25 : 205) + rnd(131), nd = $('.needle');
  const to = Math.ceil(needleAng / 360) * 360 + 360 * 4 + target; needleAng = to;
  $$('#acts .btn').forEach(x => x.disabled = true);
  if (nd) nd.style.transform = `rotate(${to}deg)`;
  later(matchMedia('(prefers-reduced-motion:reduce)').matches ? 400 : 2550, () => { busy = false; wash(); render(); });
}
function todChoose(t) { if (G.phase !== 'choose') return; G.card = draw(t); G.phase = 'card'; save(); render(); }
function todSwap() { if (G.phase !== 'card' || G.swapLeft < 1) return; G.swapLeft--; G.card = draw(G.card.t); save(); render(); }
function todDone() {
  if (G.phase !== 'card') return; const p = G.turn, t = G.card.t;
  G.cnt[p][t]++; G.run[p] = t === 's' ? G.run[p] + 1 : 0; G.card = null; G.phase = 'spin'; G.round++; G.turn = null; save(); wash(); render();
}
R.tod = () => {
  const p = G.turn, stage = $('#stage'), acts = $('#acts');
  $('#play-title').textContent = `真心话大冒险 · ${G.deckName}`;
  scoreboard(G.phase === 'spin' ? null : p, q => ({ badge: G.cnt[q].s + G.cnt[q].d, body: el('div', 'meta', `真心话 ${G.cnt[q].s} · 大冒险 ${G.cnt[q].d}`) }));
  if (G.phase === 'card') {
    const c = G.card; banner('轮到', G.names[p]);
    stage.append(cardEl(c, p, null, c.t === 's' ? '真心话' : '大冒险'));
    const sw = btn(G.swapLeft > 0 ? '换一题（这轮还能换 1 次）' : '这轮已经换过了', 'quiet', todSwap); sw.disabled = G.swapLeft < 1;
    acts.append(btn(c.t === 's' ? '说完了' : '做完了', '', todDone, 'i-heart'), sw); return;
  }
  const spinning = G.phase === 'spin';
  banner(spinning ? `第 ${G.round} 轮` : '指针选中了', spinning ? '这次轮到谁？' : G.names[p]);
  if (!spinning && needleAng % 360 === 0) needleAng = p === 1 ? 90 : 270;
  const w = el('div', 'wheel'), nd = el('div', 'needle'); nd.style.transform = `rotate(${needleAng}deg)`;
  w.append(el('span', 'nm l', G.names[0]), el('span', 'nm r', G.names[1]), nd, el('div', 'hub', spinning ? '?' : G.names[p].slice(0, 2)));
  stage.append(w);
  if (spinning) { w.onclick = spin; acts.append(btn('转一转', '', spin)); return; }
  const forced = G.run[p] >= 2, pair = el('div', 'pair');
  const bs = btn('真心话', 'kind t-s', () => todChoose('s')), bd = btn('大冒险', 'kind t-d', () => todChoose('d')); bs.disabled = forced; pair.append(bs, bd);
  acts.append(pair, el('div', 'note', forced ? '已经连选两次真心话，这次选大冒险吧' : `${G.names[p]}，自己挑一个`));
};

/* ---------- 双人飞行棋 ---------- */
function makeBoard(cards) {                              // 这套内容里没有的类型，棋盘上就不出现
  const has = t => cards.some(c => c.t === t), only = has('d') && has('s') ? null : has('s') ? 's' : 'd';
  const fx = { 4: '+2', 9: 'again', 13: '-2', 18: '+2', 22: 'swap', 26: '-2' }, kinds = shuffle(Array.from({ length: N - 2 - 6 }, (_, i) => only || (i % 2 ? 'd' : 's'))); let k = 0;
  return Array.from({ length: N }, (_, i) => i === 0 ? { t: 'a' } : i === LAST ? { t: 'z' } : fx[i] ? { t: 'w', fx: fx[i] } : { t: kinds[k++] });
}
INIT.chess = dk => ({ q: queues(dk.cards), phase: 'roll', pos: [0, 0], board: makeBoard(dk.cards), dice: 1, rolls: 0 });
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const setDice = (de, n) => $$('i', de).forEach((x, i) => x.classList.toggle('on', PIPS[n].includes(i)));
function place(p, idx, hop) { const pc = $(`.piece[data-p="${p}"]`), cell = $('.board').children[idx]; if (!pc || !cell) return; cell.append(pc); if (hop) { pc.classList.remove('hop'); void pc.offsetWidth; pc.classList.add('hop'); } }
function animate(from, to, jump, cb) {                    // 棋子一格一格走；状态早就存好了，这里只是演出
  const jobs = [0, 1].filter(p => from[p] !== to[p]);
  const next = () => { const p = jobs.shift(); if (p == null) return cb(); let at = from[p];
    if (jump) { place(p, to[p], true); return later(260, next); }
    const step = () => { if (at === to[p]) return later(120, next); at += to[p] > at ? 1 : -1; place(p, at, true); later(190, step); }; step(); };
  next();
}
function afterMove(msg) { busy = false; if (G.winner != null) return go('win'); wash(); render(); if (msg) toast(msg); }
function roll() {
  if (busy || G.phase !== 'roll') return; busy = true;
  const me = G.turn, n = 1 + rnd(6), from = G.pos.slice();
  G.dice = n; G.rolls++; G.pos[me] = Math.min(LAST, from[me] + n);
  if (G.pos[me] >= LAST) G.winner = me;
  else { const cell = G.board[G.pos[me]]; G.card = cell.t === 'w' ? { t: 'w', who: 'me', fx: cell.fx, title: FX[cell.fx].title, text: FX[cell.fx].text } : draw(cell.t); G.phase = 'card'; }
  save();
  const de = $('.dice'), bt = $('#acts .btn'); if (bt) bt.disabled = true; de.classList.add('rolling'); let k = 0;
  const tick = () => { if (k++ < 7) { setDice(de, 1 + rnd(6)); return later(70, tick); } de.classList.remove('rolling'); setDice(de, n); later(280, () => animate(from, G.pos.slice(), false, () => later(200, afterMove))); };
  tick();
}
function chessDone(done) {
  const c = G.card; if (!c || busy || G.phase !== 'card') return; busy = true;
  const me = G.turn, from = G.pos.slice();
  if (c.fx === '+2') G.pos[me] = Math.min(LAST, G.pos[me] + 2);
  else if (c.fx === '-2' || (!c.fx && !done)) G.pos[me] = Math.max(0, G.pos[me] - 2);
  else if (c.fx === 'swap') G.pos = [G.pos[1], G.pos[0]];
  G.card = null; G.phase = 'roll';
  if (G.pos[me] >= LAST) G.winner = me; else if (c.fx !== 'again') G.turn = 1 - me;
  save(); $('#cardveil').hidden = true;
  animate(from, G.pos.slice(), c.fx === 'swap', () => afterMove(c.fx === 'again' ? '再掷一次' : ''));
}
function showCardVeil() {
  const c = G.card, me = G.turn, acts = $('#cv-acts'); if (!c) return;
  $('#cv-card').replaceChildren(cardEl(c, me)); acts.replaceChildren();
  if (c.fx) acts.append(btn('好的', '', () => chessDone(true)));
  else acts.append(btn(TYPE[c.t].done, '', () => chessDone(true), 'i-heart'), btn('不做，后退 2 格', 'soft', () => chessDone(false)));
  $('#cardveil').hidden = false;
}
R.chess = () => {
  const me = G.turn, stage = $('#stage'), acts = $('#acts');
  $('#play-title').textContent = `飞行棋 · ${G.deckName}`;
  scoreboard(me, p => { const bar = el('div', 'prog'), f = el('i'); f.style.width = (G.pos[p] / LAST * 100) + '%'; bar.append(f); return { badge: `${G.pos[p] + 1}/${N}`, body: bar }; });
  banner(G.phase === 'card' ? '轮到' : '轮到 · 掷骰子', G.names[me]);
  stage.classList.add('cq'); const bd = el('div', 'board');
  G.board.forEach((c, i) => {
    const row = Math.floor(i / 6), col = row % 2 ? 5 - i % 6 : i % 6, cell = el('div', 'cell t-' + c.t);
    cell.style.gridRow = row + 1; cell.style.gridColumn = col + 1;
    if (c.t === 'a') cell.append('起'); else if (c.t === 'z') cell.append('终'); else { cell.append(el('u', '', i + 1)); if (c.t === 'w') cell.append(FX[c.fx].label); else cell.append(icon('i-' + c.t)); }
    bd.append(cell);
  });
  stage.append(bd);
  [0, 1].forEach(p => { const pc = el('div', 'piece' + (p === me ? ' me' : ''), G.names[p].slice(0, 1)); pc.dataset.p = p; bd.children[G.pos[p]].append(pc); });
  const de = el('div', 'dice'); for (let i = 0; i < 9; i++) de.append(el('i')); setDice(de, G.dice);
  const row = el('div', 'rowx'), rb = btn('掷骰子', '', roll); rb.disabled = G.phase !== 'roll'; row.append(de, rb); acts.append(row);
  if (G.phase === 'card') showCardVeil();
};

/* ---------- 结束 ---------- */
function renderWin() {
  const w = G.winner, l = 1 - w;
  $('#win-name').textContent = G.names[w] + ' 赢了';
  const p = $('#win-wish'); p.replaceChildren(); p.append(el('b', '', G.names[w]), ' 可以向 ', el('b', '', G.names[l]), ' 许一个愿望。说出来吧，TA 要认真完成。');
  $('#win-stat').textContent = G.game === 'chess' ? `这一局一共掷了 ${G.rolls} 次骰子` : `这一局一共翻了 ${G.drawn} 张牌 · ${G.names[0]} ${G.hearts[0]} 颗心，${G.names[1]} ${G.hearts[1]} 颗心`;
}

$('#go-resume').onclick = () => go('play');
$('#start').onclick = () => newGame(setupGame);
$('#again').onclick = () => newGame(G.game);
$('#open-rules').onclick = () => openRules(G.game);

function start(data) {
  const sv = data && data.P ? data : load();
  if (sv.P) P = Object.assign(P, sv.P);
  if (!P.seenRules || typeof P.seenRules !== 'object') P.seenRules = P.seenRules ? { cards: true } : {};
  if (!Array.isArray(P.imported)) P.imported = [];
  if (sv.G && sv.G.winner == null && sv.G.names) { G = sv.G; if (!G.game) { G.game = 'cards'; G.deckName = G.deckName || ''; } if (!R[G.game]) G = null; }
  go(data && data.screen === 'play' && G ? 'play' : 'home');
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ P, G, screen }));
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
