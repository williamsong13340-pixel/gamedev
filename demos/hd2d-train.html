<meta charset="utf-8">
<title>冰原列车 HD-2D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-bleed WebGL canvas (the scene); a quiet HUD floats in the corners. */
:root{
  --night:#070a10;
  --snow:#e8eef2;
  --snow-dim:rgba(232,238,242,.64);
  --glass:rgba(12,18,28,.52);
  --edge:rgba(232,238,242,.18);
  --amber:#f2a65a;
  --amber-ink:#ffe2bd;
  --font-title:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","Noto Serif CJK SC",serif;
  --font-ui:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--snow);overflow:hidden;font-family:var(--font-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.drag{cursor:grabbing}
.hud{position:fixed;z-index:2;pointer-events:none}
.title{top:calc(env(safe-area-inset-top,0px) + 14px);left:calc(env(safe-area-inset-left,0px) + 18px);transition:opacity 1.6s ease}
.title h1{margin:0;font-family:var(--font-title);font-weight:600;font-size:20px;letter-spacing:.34em;text-shadow:0 1px 12px rgba(0,0,0,.7)}
.title p{margin:5px 0 0;font-size:11px;letter-spacing:.14em;color:var(--snow-dim);text-shadow:0 1px 8px rgba(0,0,0,.8)}
.ctrl{right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:8px;pointer-events:auto}
.ctrl button{font:inherit;font-size:12px;letter-spacing:.08em;color:var(--snow);background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:7px 13px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ctrl button[aria-pressed="true"]{border-color:rgba(242,166,90,.55);color:var(--amber-ink)}
.ctrl button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hint{left:calc(env(safe-area-inset-left,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);font-size:11px;letter-spacing:.12em;color:var(--snow-dim);text-shadow:0 1px 8px rgba(0,0,0,.8);transition:opacity 1.2s ease}
.fade{opacity:0}
#msg{position:fixed;inset:0;display:grid;place-items:center;font-size:13px;letter-spacing:.14em;color:var(--snow-dim);z-index:3;pointer-events:none}
#fps{position:fixed;top:4px;right:6px;font:11px/1 monospace;color:#9fb;z-index:4}
[hidden]{display:none!important}
</style>
<canvas id="c" aria-label="像素风 HD-2D 场景：冰原上一列亮着暖灯的列车在夜里行驶"></canvas>
<div class="hud title" id="title"><h1>冰原列车</h1><p>HD-2D 光影 · 画面全部由代码实时绘制</p></div>
<div class="hud hint" id="hint">左右拖动画面，沿着列车看</div>
<div class="hud ctrl"><button type="button" id="fxBtn" aria-pressed="true">光影：开</button><button type="button" id="pauseBtn" aria-pressed="false">暂停</button></div>
<div id="msg">正在生成画面…</div>
<script>
function hd2dMain(){
'use strict';
const params = new URLSearchParams(location.search);
const CAPTURE = params.has('capture');
const DEBUG = params.has('debug');
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* =====================================================================
   World layout (all in "art pixels"; 270 art px = screen height in landscape)
   Camera looks at the train side from distance D; horizon row 100;
   ground directly under the train side is row 208.
   ===================================================================== */
const TY0 = 100, TH = 112;                 // train buffer covers art rows 100..211
const HORIZON = 100, GROUND_Y = 208, HCAM = GROUND_Y - HORIZON;
const D = 400;                             // camera -> train side distance (world px)
const SPEED = 128;                         // train speed, art px / s at the train's depth
const WRAP = 8192;                         // period of the ground pattern
const JOINT = 300;                         // rail joint spacing (clickety-clack)

/* ---------------- random & noise ---------------- */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function ih(x, y, s){ let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul((s | 0) + 1, 1442695041)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function noise1D(period, cells, rng){ const v = new Float32Array(cells); for (let i = 0; i < cells; i++) v[i] = rng() * 2 - 1; return x => { let f = (x / period) * cells; f = ((f % cells) + cells) % cells; const i = Math.floor(f), t = f - i, s = t * t * (3 - 2 * t); return v[i] + (v[(i + 1) % cells] - v[i]) * s; }; }
function wob(t, s){ return 0.5 + 0.22 * Math.sin(t * 7.3 + s) + 0.16 * Math.sin(t * 13.7 + s * 2.1) + 0.12 * Math.sin(t * 23.1 + s * 3.7); }
const mod = (a, n) => ((a % n) + n) % n;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

/* ---------------- colour ---------------- */
function C(h){ const n = parseInt(h.slice(1), 16); return (0xff000000 | ((n & 255) << 16) | (n & 0xff00) | ((n >>> 16) & 255)) >>> 0; }
function rgbOf(c){ return [c & 255, (c >>> 8) & 255, (c >>> 16) & 255]; }
function pack(r, g, b){ r = clamp(r, 0, 255); g = clamp(g, 0, 255); b = clamp(b, 0, 255); return (0xff000000 | (b << 16) | (g << 8) | r) >>> 0; }
function mixC(a, b, t){ const A = rgbOf(a), B = rgbOf(b); return pack(Math.round(A[0] + (B[0] - A[0]) * t), Math.round(A[1] + (B[1] - A[1]) * t), Math.round(A[2] + (B[2] - A[2]) * t)); }
function mulC(c, k){ const A = rgbOf(c); return pack(Math.round(A[0] * k), Math.round(A[1] * k), Math.round(A[2] * k)); }
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bay = (x, y) => (BAY[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
function ramp2(arr, t, x, y){ if (t <= 0) return arr[0]; if (t >= 1) return arr[arr.length - 1]; const f = t * (arr.length - 1); let i = Math.floor(f); const fr = f - i; if (fr > 0.6 || (fr > 0.4 && ((x + y) & 1))) i++; return arr[Math.min(i, arr.length - 1)]; }
function ramp(arr, t, x, y){ if (t <= 0) return arr[0]; if (t >= 1) return arr[arr.length - 1]; const f = t * (arr.length - 1); let i = Math.floor(f); if (f - i > bay(x, y)) i++; return arr[i]; }

// Palette. Cold world built on the art-bible anchors #1B2433 #3C4A5C #7FA3B8 #E8EEF2;
// rust #7A4A32 and old wood #5C4636 at night; warm colours only for light.
const HEX = {
  k0:'#0c1119', k1:'#131a26', k2:'#1B2433', k3:'#222d3f', k4:'#2b384b', k5:'#3C4A5C', k6:'#4a5c70', k7:'#5a7085',
  k8:'#6c879d', k9:'#7FA3B8', k10:'#9ab7c8', k11:'#b6cbd8', k12:'#d0dee7', k13:'#E8EEF2', k14:'#f7fafc',
  d0:'#19140f', d1:'#251d17', d2:'#33281f', d3:'#433429', d4:'#5C4636', d5:'#6f5644',
  r0:'#26170f', r1:'#3d2418', r2:'#553222', r3:'#6a3f2b', r4:'#7A4A32', r5:'#8f5c3e'
};
const P = {}; for (const k in HEX) P[k] = C(HEX[k]);
// lamp-lit interior surfaces: dark warm brown -> amber -> cream
const LIT = ['#1e0e08','#2e160c','#421f10','#5a2a14','#74381a','#8f4a22','#ab5f2c','#c47838','#d99248','#e9ac5e','#f3c47a','#f9d99a','#fdeabb','#fff6dc'].map(C);
const GROW = ['#2a1416','#3e1e1e','#562a26','#703a30','#8c4c3c','#a8604a','#c27858','#d69168','#e5aa7e','#efc298','#f6d8b4','#fbe8d0','#fef4e8'].map(C);
const WORK = ['#11151c','#181e27','#222831','#2e333b','#3e3c3c','#544a42','#6e5a48','#8a6e52','#a6855e','#c09e70','#d8b888','#ecd2a6'].map(C);

/* ---------------- pixel canvas ---------------- */
class PC {
  constructor(w, h, wrap){ this.w = w; this.h = h; this.wrap = !!wrap; this.d = new Uint32Array(w * h); }
  i(x, y){ x = Math.floor(x); y = Math.floor(y); if (y < 0 || y >= this.h) return -1; if (this.wrap) x = ((x % this.w) + this.w) % this.w; else if (x < 0 || x >= this.w) return -1; return y * this.w + x; }
  set(x, y, c){ const i = this.i(x, y); if (i >= 0) this.d[i] = c; }
  get(x, y){ const i = this.i(x, y); return i >= 0 ? this.d[i] : 0; }
  rect(x, y, w, h, c){ for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) this.set(xx, yy, c); }
  line(x0, y0, x1, y1, c){ x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1); const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy; for (let n = 0; n < 4000; n++){ this.set(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy){ e += dy; x0 += sx; } if (e2 <= dx){ e += dx; y0 += sy; } } }
  clear(){ this.d.fill(0); }
}
function spr(str, pal){ const rows = str.trim().split(/\n/).map(s => s.trim()); const h = rows.length, w = Math.max.apply(null, rows.map(r => r.length)); const pc = new PC(w, h); for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++){ const ch = rows[y][x]; if (ch !== '.' && pal[ch] !== undefined) pc.set(x, y, pal[ch]); } return pc; }

/* =====================================================================
   Background layers (tileable strips, drawn once)
   ===================================================================== */
const baseRow = (z, yTop) => Math.round(HORIZON + HCAM * D / z) - yTop;

function genMountains(){
  const W = 1024, H = 128, yTop = -20, z = 60 * D, base = baseRow(z, yTop);
  const pc = new PC(W, H, true), r = mulberry32(1013);
  const a = noise1D(W, 7, r), b = noise1D(W, 17, r), c = noise1D(W, 41, r), d = noise1D(W, 97, r);
  const ridge = x => { const q = 1 - Math.abs(b(x)); return 30 + 13 * a(x) + 22 * q * q * q + 4 * c(x) + 1.4 * d(x); };
  for (let x = 0; x < W; x++){
    const top = Math.round(base - ridge(x)), sl = ridge(x + 1) - ridge(x - 1);
    for (let y = Math.max(0, top); y <= base; y++){
      const dep = y - top, xs = x + dep * 0.85;
      const sl2 = ridge(xs + 1.5) - ridge(xs - 1.5);
      let t = 0.5 + clamp(sl2, -1.2, 1.2) * 0.32 - dep / 70 * 0.3;
      const rock = dep > 3 && ih(Math.floor(x * 0.6 - dep * 0.55 * (sl2 > 0 ? 1 : -1)), Math.floor(dep / 2), 7) < 0.13;
      if (rock) t -= 0.22;
      let col = ramp([P.k5, P.k6, P.k7, P.k8, P.k9, P.k10, P.k11], t, x, y);
      if (dep === 0) col = sl > 0 ? P.k12 : P.k10;
      pc.set(x, y, col);
    }
  }
  const hill = x => 7 + 4 * a(x * 1.7 + 300) + 2.5 * c(x + 200) + 0.8 * d(x * 1.3);
  for (let x = 0; x < W; x++){
    const top = Math.round(base - hill(x)), sl = hill(x + 1) - hill(x - 1);
    for (let y = top; y <= base; y++){
      const dep = y - top;
      let col = dep === 0 ? (sl > 0 ? P.k10 : P.k8) : (sl > 0.1 ? P.k7 : P.k6);
      if (dep > 2) col = ramp([P.k6, P.k5], (dep - 2) / 6, x, y);
      if (dep >= 1 && ih(x, y, 5) < 0.09) col = P.k4;
      pc.set(x, y, col);
    }
  }
  return {pc, yTop, z, lights: []};
}

function genCity(){
  const W = 2048, H = 128, yTop = -20, z = 20 * D, base = baseRow(z, yTop);
  const pc = new PC(W, H, true), r = mulberry32(2029), lights = [];
  const S = (x, y, c) => pc.set(x, y, c);
  function drift(x0, w){ for (let i = -3; i < w + 3; i++){ const hh = Math.max(1, Math.round(2.2 + 1.6 * Math.sin((i + 3) / (w + 6) * Math.PI) + (r() - 0.5))); for (let j = 0; j < hh; j++) S(x0 + i, base - j, j === hh - 1 ? P.k10 : P.k8); } }
  function tower(x0){
    const w = 6 + Math.floor(r() * 12), h = 18 + Math.floor(Math.pow(r(), 1.3) * 64), top = base - h, broken = r() < 0.5, style = r();
    const roof = []; let k = 0;
    for (let i = 0; i < w; i++){ if (broken){ k += Math.floor(r() * 5) - 2; k = clamp(k, 0, 16); } roof.push(top + (broken ? k : 0)); }
    for (let i = 0; i < w; i++) for (let y = roof[i]; y <= base; y++){
      let c = i === 0 ? P.k6 : (i === w - 1 ? P.k3 : P.k4);
      const fy = y - top;
      if (style < 0.6){ if (i > 0 && i < w - 1 && fy % 4 === 2 && i % 2 === 1) c = ih(x0 + i, y, 3) < 0.9 ? P.k2 : P.k7; }
      else if (i > 0 && i < w - 1 && fy % 3 !== 0 && i % 3 !== 0) c = P.k3;
      if (fy % 9 === 0 && fy > 0 && ih(x0 + i, y, 4) < 0.75) c = P.k9;
      S(x0 + i, y, c);
    }
    for (let i = 0; i < w; i++) S(x0 + i, roof[i], i < w / 2 ? P.k12 : P.k10);
    if (broken){ const m = 1 + Math.floor(r() * 3); for (let n = 0; n < m; n++){ const i = Math.floor(r() * w), len = 2 + Math.floor(r() * 7); for (let j = 1; j <= len; j++) S(x0 + i, roof[i] - j, P.k4); } }
    if (r() < 0.1 && w > 7){ const lx = x0 + 1 + 2 * Math.floor(r() * ((w - 2) / 2)), ly = top + 6 + 4 * Math.floor(r() * Math.max(1, h / 4 - 2)); S(lx, ly, C('#8a5634')); lights.push({x: lx, y: ly, c: [1.0, 0.6, 0.28], k: 0.35, size: 4, flicker: 1}); }
    drift(x0, w); return w;
  }
  function tilted(x0){
    const w = 7 + Math.floor(r() * 6), h = 30 + Math.floor(r() * 30), lean = (r() < 0.5 ? -1 : 1) * (0.12 + r() * 0.2);
    for (let y = 0; y < h; y++){ const off = Math.round(y * lean); for (let i = 0; i < w; i++){ let c = i === 0 ? P.k6 : (i === w - 1 ? P.k3 : P.k4); if (i > 0 && i < w - 1 && y % 4 === 2 && i % 2 === 1) c = P.k2; S(x0 + i + off, base - y, c); } }
    const offT = Math.round(h * lean); for (let i = 0; i < w; i++) S(x0 + i + offT, base - h, P.k11);
    drift(x0, w); return w + Math.abs(offT) + 2;
  }
  function crane(x0){
    const h = 46 + Math.floor(r() * 24), top = base - h, dir = r() < 0.5 ? 1 : -1, jib = 20 + Math.floor(r() * 18);
    const cx = dir > 0 ? x0 + 8 : x0 + jib + 2;
    for (let y = top; y <= base; y++){ S(cx - 1, y, P.k4); S(cx + 1, y, P.k3); if ((y - top) % 3 === 0) S(cx, y, P.k4); }
    for (let i = -7; i <= jib; i++){ S(cx + i * dir, top, P.k4); if (i % 3 === 0) S(cx + i * dir, top + 1, P.k3); if (ih(x0 + i, 1, 77) < 0.5) S(cx + i * dir, top - 1, P.k9); }
    pc.line(cx, top - 5, cx + jib * dir, top, P.k3); pc.line(cx, top - 5, cx - 7 * dir, top, P.k3);
    const hx = cx + Math.floor(jib * 0.65) * dir, hl = 8 + Math.floor(r() * 14);
    for (let y = top + 1; y < top + hl; y++) S(hx, y, P.k3);
    S(hx, top + hl, P.k4); S(hx - 1, top + hl, P.k4);
    for (let i = 0; i < 3; i++) for (let j = 1; j < 4; j++) S(cx - (5 + i) * dir, top + j, P.k3);
    return jib + 12;
  }
  function mast(x0){
    const h = 60 + Math.floor(r() * 22), top = base - h, cx = x0 + 14;
    for (let y = top; y <= base; y++){ const tt = (y - top) / h, hw = Math.round(0.5 + tt * 3.5); S(cx - hw, y, P.k4); S(cx + hw, y, P.k3); if ((y - top) % 4 === 0) for (let i = -hw; i <= hw; i++) S(cx + i, y, P.k4); else if ((y - top) % 4 === 2) S(cx, y, P.k3); }
    S(cx, top - 1, C('#4a1612'));
    lights.push({x: cx, y: top - 1, c: [1.0, 0.16, 0.1], k: 1.0, size: 6, blink: 1.7 + r()});
    pc.line(cx, top + 10, cx - 13, base, P.k3); pc.line(cx, top + 10, cx + 13, base, P.k3);
    return 30;
  }
  function dome(x0){
    const rw = 10 + Math.floor(r() * 8), rh = 7 + Math.floor(r() * 5), wallH = 6 + Math.floor(r() * 8), cx = x0 + rw;
    for (let i = -rw; i <= rw; i++){
      const top = Math.round(base - wallH - rh * Math.sqrt(Math.max(0, 1 - (i * i) / (rw * rw))));
      const hole = i > rw * 0.2 && i < rw * 0.6;
      for (let y = top; y <= base; y++){ if (hole && y < base - wallH) continue; let c = i < -rw * 0.5 ? P.k5 : P.k4; if ((i + rw) % 5 === 0) c = P.k3; S(cx + i, y, c); }
      if (!hole) S(cx + i, top, i < 0 ? P.k12 : P.k10);
    }
    drift(x0, rw * 2); return rw * 2 + 3;
  }
  function ferris(x0){
    const R = 12 + Math.floor(r() * 4), cx = x0 + R + 2, cy = base - R - 3;
    for (let k = 0; k < 72; k++){ const a = k / 72 * Math.PI * 2; S(Math.round(cx + Math.cos(a) * R), Math.round(cy + Math.sin(a) * R), P.k4); }
    for (let k = 0; k < 8; k++){ const a = k / 8 * Math.PI * 2 + 0.2; pc.line(cx, cy, cx + Math.cos(a) * R, cy + Math.sin(a) * R, P.k3); const gx = Math.round(cx + Math.cos(a) * R), gy = Math.round(cy + Math.sin(a) * R); S(gx, gy + 1, P.k3); S(gx + 1, gy + 1, P.k3); S(gx, gy + 2, P.k3); S(gx + 1, gy + 2, P.k3); }
    pc.line(cx, cy, cx - 7, base, P.k4); pc.line(cx, cy, cx + 7, base, P.k3);
    drift(x0, R * 2 + 4); return R * 2 + 6;
  }
  function low(x0){
    const w = 16 + Math.floor(r() * 16), h = 7 + Math.floor(r() * 9), top = base - h;
    for (let i = 0; i < w; i++) for (let y = top; y <= base; y++){ let c = i === 0 ? P.k5 : P.k4; if (y > top + 1 && (y - top) % 3 === 1 && i % 3 === 1) c = P.k2; S(x0 + i, y, c); }
    for (let i = 0; i < w; i++) S(x0 + i, top, P.k10);
    if (r() < 0.6){ const cx = x0 + 3 + Math.floor(r() * (w - 6)), ch = 10 + Math.floor(r() * 14); for (let y = top - ch; y < top; y++){ S(cx, y, P.k5); S(cx + 1, y, P.k3); } S(cx, top - ch, P.k10); }
    drift(x0, w); return w;
  }
  let x = 4;
  while (x < W - 40){
    if (r() < 0.11){ x += 18 + Math.floor(r() * 50); continue; }
    const t = r();
    if (t < 0.52) x += tower(x); else if (t < 0.62) x += low(x); else if (t < 0.70) x += crane(x);
    else if (t < 0.76) x += tilted(x); else if (t < 0.82) x += mast(x); else if (t < 0.89) x += dome(x);
    else if (t < 0.93) x += ferris(x); else x += tower(x);
    x += Math.floor(r() * 3);
  }
  return {pc, yTop, z, lights};
}

function genMid(){
  const W = 2048, H = 64, yTop = 76, z = 4.5 * D, base = baseRow(z, yTop);
  const pc = new PC(W, H, true), r = mulberry32(3301);
  const S = (x, y, c) => pc.set(x, y, c);
  const ND = C('#101b24'), NM = C('#17263a');
  function conifer(cx, b, h){
    const top = b - h, trunk = Math.max(1, Math.round(h * 0.12)), cb = b - trunk, tiers = Math.max(2, Math.round(h / 5));
    for (let y = cb; y <= b; y++) S(cx, y, P.k2);
    const halfAt = y => { if (y < top) return -1; const tt = (y - top) / (cb - top); const ph = ((tt * tiers) % 1 + 1) % 1; return Math.max(0, Math.round((0.6 + tt * h * 0.25) * (0.55 + 0.45 * ph))); };
    for (let y = top; y < cb; y++){
      const hw = halfAt(y), ha = halfAt(y - 1);
      for (let dx = -hw; dx <= hw; dx++){
        let c;
        if (Math.abs(dx) > ha) c = dx <= 0 ? P.k12 : P.k10;
        else if (Math.abs(dx) > ha - 1 && ih(cx + dx, y, 2) < 0.5) c = P.k9;
        else c = dx < 0 ? NM : ND;
        S(cx + dx, y, c);
      }
    }

  setU(o, 'u_strip', [mod(camX, 512), 198, 512, 16]); setU(o, 'u_cx', cxv); setU(o, 'u_fx', fx); setU(o, 'u_trainX', trainX); setU(o, 'u_plowX', trainX + LOCO_FRONT - 1); setU(o, 'u_span', [trainX + PAD - 2, trainX + LOCO_FRONT - 4]); setLights(o); drawQuad(o);

  o = progs.train; gl.useProgram(o.p); setU(o, 'u_view', V); setU(o, 'u_rect', [trainX, TY0, trainX + TRW, TY0 + TH]); setT(o, 'u_tex', texTrain, 0); setU(o, 'u_trainX', trainX); setU(o, 'u_fx', fx); setLights(o); drawQuad(o);

  strip(L.bank);

  const smoke = (ps, emit, rel, warm, dark) => { const p = progs.smoke; gl.useProgram(p.p); setU(p, 'u_view', V); setU(p, 'u_time', t); setU(p, 'u_fx', fx); setU(p, 'u_cx', cxv); setU(p, 'u_trainX', trainX); setU(p, 'u_emit', emit); setU(p, 'u_rel', rel); setU(p, 'u_warm', warm); setU(p, 'u_dark', dark); drawParticles(p, ps); };
  smoke(PS.smoke, [trainX + loco.x + loco.stack.x, loco.stack.y, 1.0], 1.0, 1.0, 1.0);
  smoke(PS.smoke2, [trainX + living.x + living.chimney.x, living.chimney.y, 0.45], 0.9, 0.5, 1.25);
  smoke(PS.steam, [trainX + work.x + work.chimney.x, work.chimney.y, 0.45], 0.9, 0.5, 1.25);
  const ember = (ps, emit, boost, spread) => { const p = progs.ember; gl.useProgram(p.p); setU(p, 'u_view', V); setU(p, 'u_time', t); setU(p, 'u_fx', fx); setU(p, 'u_cx', cxv); setU(p, 'u_trainX', trainX); setU(p, 'u_emit', emit); setU(p, 'u_boost', boost); setU(p, 'u_spread', spread); drawParticles(p, ps); };
  ember(PS.embers, [trainX + loco.x + loco.stack.x, loco.stack.y + 1], 0.35 + 0.5 * state.fire, 6);
  ember(PS.wheelSparks, [trainX + loco.x + 94, 204], 0.12, 60);
  ember(PS.embers2, [trainX + living.x + living.chimney.x, living.chimney.y + 1], 0.3, 2);
  ember(PS.embers3, [trainX + work.x + work.chimney.x, work.chimney.y + 1], 0.25, 2);
  o = progs.spray; gl.useProgram(o.p); setU(o, 'u_view', V); setU(o, 'u_time', t); setU(o, 'u_fx', fx); setU(o, 'u_cx', cxv); setU(o, 'u_trainX', trainX); setU(o, 'u_plow', [trainX + LOCO_FRONT, 204]); setLights(o); drawParticles(o, PS.spray);

  snow(PS.nearSnow, [0.5 * D, 0.985 * D], 1.8, 1.0);
  snow(PS.focusFront, [0.84 * D, 0.99 * D], 1.8, 1.0);
  strip(L.fg); strip(L.fg2);
  o = progs.pole; gl.useProgram(o.p); setU(o, 'u_view', V); setU(o, 'u_rect', [view.x0, view.y0, view.x0 + view.w, view.y0 + view.h]); setU(o, 'u_cx', cxv); setU(o, 'u_scroll', mod(camX * D / (0.3 * D), 4200)); setU(o, 'u_period', 4200); setU(o, 'u_fx', fx); setU(o, 'u_top', HORIZON + HCAM / 0.3 - 130 / 0.3); drawQuad(o);
  snow(PS.bokeh, [0.2 * D, 0.45 * D], 2.0, 0.55);

  gl.blendFunc(gl.ONE, gl.ONE);
  o = progs.vol; gl.useProgram(o.p); setU(o, 'u_view', V); setU(o, 'u_lamp', lens); setU(o, 'u_time', t); setU(o, 'u_fx', fx); setU(o, 'u_camX', mod(camX, 4096)); setU(o, 'u_headI', 1.0); setU(o, 'u_trainX', trainX); setLights(o);
  if (fx > 0.01){
    const bx0 = Math.max(view.x0, lens[0] - 8), bx1 = view.x0 + view.w;
    if (bx1 > bx0){ setU(o, 'u_mode', 0); setU(o, 'u_rect', [bx0, lens[1] - 90, bx1, lens[1] + 100]); drawQuad(o); }
    const wx0 = Math.max(view.x0, trainX), wx1 = Math.min(view.x0 + view.w, trainX + LOCO_FRONT);
    if (wx1 > wx0){ setU(o, 'u_mode', 1); setU(o, 'u_rect', [wx0 - 30, 112, wx1 + 30, 262]); drawQuad(o); }
  }

  // ---------- glow buffer (things that emit light) ----------
  gl.bindFramebuffer(gl.FRAMEBUFFER, glowF.fb); gl.viewport(0, 0, glowF.w, glowF.h);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.blendFunc(gl.ONE, gl.ONE);
  o = progs.bright; gl.useProgram(o.p); setT(o, 'u_src', scene.tex, 0); setU(o, 'u_thr', 0.86); setU(o, 'u_gain', 0.7); drawQuad(o);
  o = progs.texk; gl.useProgram(o.p); setU(o, 'u_view', V); setU(o, 'u_rect', [trainX, TY0, trainX + TRW, TY0 + TH]); setT(o, 'u_tex', texTrainE, 0); setU(o, 'u_k', 0.75); drawQuad(o);
  const glow = (x, y, rx, ry, col, core) => { const p = progs.glow; gl.useProgram(p.p); setU(p, 'u_view', V); setU(p, 'u_rect', [x - rx, y - ry, x + rx, y + ry]); setU(p, 'u_col', col); setU(p, 'u_core', core || 6); drawQuad(p); };
  for (const car of cars){ const b = state.bounce[car.kind] || 0; for (const l of car.lamps){ const k = 0.35 * (0.9 + 0.1 * wob(t * 1.7, car.x)); glow(trainX + car.x + l.x, l.y + b, 10, 10, [1.0 * k, 0.62 * k, 0.3 * k]); } }
  glow(lens[0] + 0.5, lens[1], 20, 20, [0.75, 0.68, 0.55], 9);
  glow(lens[0] + 0.5, lens[1], 110, 2.5, [0.1, 0.12, 0.16], 3);
  const ap = [trainX + loco.x + loco.ashpan.x, loco.ashpan.y]; const ak = 0.25 + 0.6 * state.fire; glow(ap[0], ap[1], 18, 10, [1.0 * ak, 0.45 * ak, 0.15 * ak]);
  glow(trainX + work.x + work.tail.x, work.tail.y, 8, 8, [0.7, 0.08, 0.05]);
  for (const Ly of [L.city, L.near]){
    const sc = mod(camX * D / Ly.z, Ly.w);
    for (const li of Ly.lights){
      let sx = li.x - sc + cxv; sx = view.x0 - 20 + mod(sx - (view.x0 - 20), Ly.w);
      if (sx > view.x0 + view.w + 20) continue;
      let k = li.k; if (li.blink) k *= (mod(t, li.blink) < 0.5 ? 1 : 0.05); if (li.flicker) k *= 0.7 + 0.3 * wob(t * 0.5, li.x);
      const fogK = 1 - Ly.fog * 0.6;
      glow(sx + 0.5, Ly.yTop + li.y + 0.5, li.size, li.size, [li.c[0] * k * fogK, li.c[1] * k * fogK, li.c[2] * k * fogK], 5);
    }
  }
  // ---------- bloom: downsample chain, then upsample and accumulate ----------
  gl.disable(gl.BLEND);
  let src = glowF;
  for (let i = 0; i < chain.length; i++){ const dst = chain[i]; gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb); gl.viewport(0, 0, dst.w, dst.h); o = progs.down; gl.useProgram(o.p); setT(o, 'u_src', src.tex, 0); setU(o, 'u_texel', [0.5 / src.w, 0.5 / src.h]); drawQuad(o); src = dst; }
  let up = chain[chain.length - 1];
  for (let i = chain.length - 2; i >= -1; i--){
    const add = i >= 0 ? chain[i] : glowF; const dst = i >= 0 ? chain.up[i] : chain.up0;
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb); gl.viewport(0, 0, dst.w, dst.h);
    o = progs.up; gl.useProgram(o.p); setT(o, 'u_src', up.tex, 0); setT(o, 'u_add', add.tex, 1); setU(o, 'u_texel', [0.5 / up.w, 0.5 / up.h]); setU(o, 'u_addK', i >= 0 ? 0.9 : 0.6); drawQuad(o);
    up = dst;
  }
  // ---------- final ----------
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, view.rw, view.rh);
  o = progs.final; gl.useProgram(o.p); setT(o, 'u_scene', scene.tex, 0); setT(o, 'u_bloom', chain.up0.tex, 1); setU(o, 'u_fx', fx); setU(o, 'u_time', t); setU(o, 'u_res', [view.rw, view.rh]); drawQuad(o);
}

/* =====================================================================
   Loop, input, HUD
   ===================================================================== */
const titleEl = document.getElementById('title'), hintEl = document.getElementById('hint'), msgEl = document.getElementById('msg');
const fxBtn = document.getElementById('fxBtn'), pauseBtn = document.getElementById('pauseBtn');
let fpsEl = null, fpsAcc = 0, fpsN = 0;
if (DEBUG){ fpsEl = document.createElement('div'); fpsEl.id = 'fps'; document.body.appendChild(fpsEl); }
resize();
window.addEventListener('resize', resize);
fxBtn.addEventListener('click', () => { fxTarget = fxTarget > 0.5 ? 0 : 1; fxBtn.textContent = fxTarget ? '光影：开' : '光影：关'; fxBtn.setAttribute('aria-pressed', fxTarget ? 'true' : 'false'); });
pauseBtn.addEventListener('click', () => { paused = !paused; pauseBtn.textContent = paused ? '继续' : '暂停'; pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false'); });
canvas.addEventListener('pointerdown', e => { cam.drag = true; cam.auto = false; cam.intro = false; cam.lastX = e.clientX; cam.vel = 0; canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId); hintEl.classList.add('fade'); });
canvas.addEventListener('pointermove', e => { if (!cam.drag) return; const dx = (e.clientX - cam.lastX) * view.w / Math.max(1, window.innerWidth); cam.lastX = e.clientX; cam.pan -= dx; cam.vel = -dx * 60; const [a, b] = panLimits(); cam.pan = clamp(cam.pan, a, b); });
const endDrag = () => { if (!cam.drag) return; cam.drag = false; cam.idle = 0; canvas.classList.remove('drag'); };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') cam.pan -= 20; else if (e.key === 'ArrowRight') cam.pan += 20; else return; cam.auto = false; cam.intro = false; const [a, b] = panLimits(); cam.pan = clamp(cam.pan, a, b); });

function frame(now){
  if (lastNow === null) lastNow = now;
  const dt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  if (!paused) simTime += dt;
  fxCur += (fxTarget - fxCur) * Math.min(1, dt * 5);
  if (cam.intro && !view.portrait){ cam.introT += dt; cam.pan = introPan() * (1 - smooth01((cam.introT - 1.2) / 11)); if (cam.introT > 12.5) cam.intro = false; }
  else if (!cam.drag){ cam.pan += cam.vel * dt; cam.vel *= Math.pow(0.02, dt); const [a, b] = panLimits(); if (cam.pan < a || cam.pan > b){ cam.pan = clamp(cam.pan, a, b); cam.vel = 0; } if (view.portrait && !cam.auto){ cam.idle += dt; if (cam.idle > 8) cam.auto = true; } }
  render(simTime);
  if (fpsEl){ fpsAcc += dt; fpsN++; if (fpsAcc > 0.5){ fpsEl.textContent = (fpsN / fpsAcc).toFixed(0) + ' fps  ' + view.rw + 'x' + view.rh + ' s' + view.s; fpsAcc = 0; fpsN = 0; } }
  requestAnimationFrame(frame);
}
msgEl.hidden = true;
if (CAPTURE){
  window.__render = (t, fx, pan) => { fxCur = fx === undefined ? 1 : fx; if (pan !== undefined){ cam.pan = pan; cam.auto = false; } render(t); return true; };
  window.__dump = (name) => { const pc = name === 'track' ? trackG.pc : ({mount: genMountains, city: genCity, mid: genMid, near: genNear, fg: genFG, fg2: genFG2, bank: genBank})[name]().pc; const c = document.createElement('canvas'); c.width = pc.w; c.height = pc.h; const x = c.getContext('2d'); const id = x.createImageData(pc.w, pc.h); id.data.set(new Uint8Array(pc.d.buffer)); x.putImageData(id, 0, 0); return c.toDataURL(); };
  window.__ready = true;
  render(simTime);
} else {
  setTimeout(() => titleEl.classList.add('fade'), 7000);
  setTimeout(() => hintEl.classList.add('fade'), 9000);
  requestAnimationFrame(frame);
}
}
// paint the loading text first, then build the scene
requestAnimationFrame(() => requestAnimationFrame(() => {
  try { hd2dMain(); }
  catch (err){ console.error(err); const m = document.getElementById('msg'); m.hidden = false; m.textContent = '画面初始化失败：' + err.message; }
}));
</script>
